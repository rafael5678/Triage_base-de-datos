name: hospital-triaje-db

services:
  db:
    image: postgres:16-alpine
    container_name: hospital-triaje
    restart: unless-stopped
    environment:
      POSTGRES_DB: hospital_triaje
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
    ports:
      - "5434:5432"
    volumes:
      - hospital_triaje_pg:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d hospital_triaje"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  hospital_triaje_pg:
